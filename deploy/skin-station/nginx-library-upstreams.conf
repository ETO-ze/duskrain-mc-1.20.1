# Included in nginx's http context. Names and destinations are fixed, never user-supplied.
proxy_cache_path /www/server/nginx/cache/duskrain-skins levels=1:2 keys_zone=duskrain_skins:8m max_size=96m inactive=1d use_temp_path=off;
limit_req_zone $binary_remote_addr zone=duskrain_skin_requests:1m rate=4r/s;
upstream dr_skin_little { server littleskin.cn:443; keepalive 8; }
upstream dr_skin_mojang { server api.mojang.com:443; keepalive 4; }
upstream dr_skin_session { server sessionserver.mojang.com:443; keepalive 4; }
upstream dr_skin_texture { server textures.minecraft.net:443; keepalive 8; }
