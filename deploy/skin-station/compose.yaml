name: duskrain-skin
services:
  skin:
    image: duskrain-drasl:4.0.1-stale-validate  # Build using session-fix/ before starting
    container_name: duskrain-skin
    restart: unless-stopped
    ports:
      - "127.0.0.1:25585:25585"
    volumes:
      - ./config:/etc/drasl:ro
      - ./data:/var/lib/drasl
      - ./branding:/opt/duskrain-branding:ro
      - ./assets:/opt/duskrain-assets:ro
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
