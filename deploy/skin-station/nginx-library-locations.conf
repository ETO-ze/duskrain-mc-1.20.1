location = /library { return 302 /library/; }
location /library/ {
    root /www/wwwroot/duskrain-skin-public;
    index index.html;
    try_files $uri $uri/ =404;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'; form-action 'self'" always;
}
location = /library/api/catalog {
    include /srv/duskrain-skin/nginx-library-proxy.conf;
    proxy_set_header Host littleskin.cn;
    proxy_ssl_name littleskin.cn;
    proxy_pass https://dr_skin_little/skinlib/list;
}
location ~ "^/library/api/info/([1-9][0-9]{0,9})$" {
    include /srv/duskrain-skin/nginx-library-proxy.conf;
    proxy_set_header Host littleskin.cn;
    proxy_ssl_name littleskin.cn;
    proxy_pass https://dr_skin_little/skinlib/info/$1;
}
location ~ "^/library/api/preview/([1-9][0-9]{0,9})$" {
    include /srv/duskrain-skin/nginx-library-proxy.conf;
    proxy_set_header Host littleskin.cn;
    proxy_ssl_name littleskin.cn;
    proxy_pass https://dr_skin_little/preview/$1?height=220;
}
location ~ "^/library/api/raw/([1-9][0-9]{0,9})$" {
    set $dr_skin_id $1;
    auth_request /_duskrain_public_skin;
    include /srv/duskrain-skin/nginx-library-proxy.conf;
    proxy_set_header Host littleskin.cn;
    proxy_ssl_name littleskin.cn;
    proxy_pass https://dr_skin_little/raw/$dr_skin_id;
}
location = /_duskrain_public_skin {
    internal;
    proxy_method GET;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host littleskin.cn;
    proxy_set_header User-Agent "DuskRain-SkinLibrary/1.0";
    proxy_ssl_server_name on;
    proxy_ssl_name littleskin.cn;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 5;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    proxy_pass https://dr_skin_little/skinlib/info/$dr_skin_id;
}
location ~ "^/library/api/mojang/name/([A-Za-z0-9_]{1,16})$" {
    include /srv/duskrain-skin/nginx-library-proxy.conf;
    proxy_set_header Host api.mojang.com;
    proxy_ssl_name api.mojang.com;
    proxy_pass https://dr_skin_mojang/users/profiles/minecraft/$1;
}
location ~ "^/library/api/mojang/profile/([A-Fa-f0-9]{32})$" {
    include /srv/duskrain-skin/nginx-library-proxy.conf;
    proxy_set_header Host sessionserver.mojang.com;
    proxy_ssl_name sessionserver.mojang.com;
    proxy_pass https://dr_skin_session/session/minecraft/profile/$1;
}
location ~ "^/library/api/mojang/texture/([A-Fa-f0-9]{32,64})$" {
    include /srv/duskrain-skin/nginx-library-proxy.conf;
    proxy_set_header Host textures.minecraft.net;
    proxy_ssl_name textures.minecraft.net;
    proxy_pass https://dr_skin_texture/texture/$1;
}
