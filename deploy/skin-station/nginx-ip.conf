# Dedicated IP HTTPS entry. Existing named websites keep their virtual hosts.
server {
    listen 443 ssl;
    http2 on;
    server_name 38.22.234.64;
    ssl_certificate /srv/duskrain-skin/tls/live/duskrain-skin-ip/fullchain.pem;
    ssl_certificate_key /srv/duskrain-skin/tls/live/duskrain-skin-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 4m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    location / {
        proxy_pass http://127.0.0.1:25585;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
