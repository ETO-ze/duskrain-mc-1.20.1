# Shared by read-only routes. No DuskRain credentials or cookies reach any provider.
limit_except GET { deny all; }
limit_req zone=duskrain_skin_requests burst=40 nodelay;
limit_req_status 429;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_pass_request_headers off;
proxy_pass_request_body off;
proxy_set_header Content-Length "";
proxy_set_header User-Agent "DuskRain-SkinLibrary/1.0 (+https://skin.duskrain.cn)";
proxy_ssl_server_name on;
proxy_ssl_verify on;
proxy_ssl_verify_depth 5;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_connect_timeout 5s;
proxy_read_timeout 15s;
proxy_send_timeout 10s;
proxy_cache duskrain_skins;
proxy_cache_key "$proxy_host$uri$is_args$args";
proxy_cache_valid 200 5m;
proxy_cache_valid 404 30s;
proxy_cache_lock on;
proxy_cache_background_update on;
proxy_hide_header Set-Cookie;
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_ignore_headers Set-Cookie Cache-Control Expires;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header X-DuskRain-Cache $upstream_cache_status always;
